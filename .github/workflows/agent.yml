name: Browser Agent

# ─────────────────────────────────────────────────────────────────────────────
# Free tier note: private repo pe `schedule` (cron) chalta HI nahi.
# Isliye repo PUBLIC rakhein — public repo me cron chalta hai aur minutes unlimited.
# ─────────────────────────────────────────────────────────────────────────────

run-name: "Agent · issue #${{ github.event.issue.number || 'manual' }} · run ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Task (goal) — khaali chhodein to tasks/scheduled.txt chalega"
        required: false
        type: string

  issues:
    types: [opened]

  # Same issue me naya instruction → wahi issue continue
  issue_comment:
    types: [created]

  schedule:
    # Roz 03:00 UTC = 08:30 IST. Public repo me hi chalega.
    - cron: "0 3 * * *"

permissions:
  contents: write
  issues: write

# Scheduled cron aur user tasks ke alag group — cron user ke task ko block na kare
concurrency:
  group: browser-agent-${{ github.event_name == 'schedule' && 'cron' || 'task' }}
  cancel-in-progress: false

jobs:
  run:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
        github.event.issue != null &&
        contains(github.event.issue.labels.*.name, 'agent-task')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue != null &&
        contains(github.event.issue.labels.*.name, 'agent-task') &&
        contains(github.event.comment.body, 'agent-continue'))
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub max ~6h per job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Restore browser profile
        uses: actions/cache@v4
        with:
          path: data/browser-profile
          key: browser-profile-${{ github.run_id }}
          restore-keys: |
            browser-profile-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mark issue as running
        if: github.event.issue != null
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name: 'agent-done' });
            } catch (e) {}
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name: 'agent-failed' });
            } catch (e) {}
            try {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: ['agent-running'] });
            } catch (e) {}

      # Agent khud issue pe LIVE progress comment banata aur update karta hai
      # (run-task.mjs → run-task.mjs: pushProgress / finalComment)
      - name: Run agent
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          FALLBACK_MODELS: ${{ vars.FALLBACK_MODELS || 'gemini-2.5-flash-lite' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          FALLBACK_PROVIDERS: ${{ vars.FALLBACK_PROVIDERS || 'dahl,groq,openrouter,nvidia,gemini' }}
          MAX_STEPS: ${{ vars.MAX_STEPS || '25' }}
          MAX_PHASES: ${{ vars.MAX_PHASES || '10' }}
          MAX_RUNTIME_MIN: ${{ vars.MAX_RUNTIME_MIN || '320' }}
          ACCURACY_TARGET: ${{ vars.ACCURACY_TARGET || '90' }}
          LIVE_FRAME_MS: ${{ vars.LIVE_FRAME_MS || '800' }}
          MAX_LIVE_FRAMES: ${{ vars.MAX_LIVE_FRAMES || '400' }}
          USER_DATA_DIR: ${{ vars.USER_DATA_DIR || './data/browser-profile' }}
          TASK_GOAL: ${{ github.event.inputs.goal || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node run-task.mjs

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ github.run_number }}
          path: |
            outputs/
            result.md
          retention-days: 30

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name  "browser-agent"
          git config user.email "browser-agent@users.noreply.github.com"
          git add outputs/ result.md 2>/dev/null || true
          git commit -m "agent: run #${{ github.run_number }}" || echo "kuch naya nahi"
          git push || echo "push skip"

      - name: Set final status label
        if: always() && github.event.issue != null
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            const outcome = '${{ steps.run.outcome }}';
            try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name: 'agent-running' }); } catch (e) {}
            try {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: n,
                labels: [outcome === 'success' ? 'agent-done' : 'agent-failed']
              });
            } catch (e) {}
            if (outcome === 'success') {
              try { await github.rest.issues.update({ ...context.repo, issue_number: n, state: 'closed' }); } catch (e) {}
            }

      - name: Summary for manual/scheduled runs
        if: always() && github.event_name != 'issues'
        run: |
          echo "### Run result" >> "$GITHUB_STEP_SUMMARY"
          cat result.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
